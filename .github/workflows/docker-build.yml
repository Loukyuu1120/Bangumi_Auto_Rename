name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bangumi-auto-rename
          tags: |
            # Push to main branch → floating :v2 tag
            type=raw,value=v2,enable={{is_default_branch}}
            # Git tag v2.1.0 → :2.1.0
            type=semver,pattern={{version}}
            # Git tag v2.1.0 → :2.1
            type=semver,pattern={{major.minor}}
            # Git tag v2.1.0 → :2  (same as :v2 but without the "v" prefix)
            type=semver,pattern={{major}}
            # Git tag → also push :latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache Go module download & build layers between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
